name: Send Daily Rates

on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 UTC every day
  workflow_dispatch:        # lets you trigger it manually too
  repository_dispatch:
    types: [trigger]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          sudo apt-get install -y libasound2t64 libgbm1 libnss3 libxss1 libatk-bridge2.0-0

      - name: Send rates
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          PYTHONUNBUFFERED: "1"
        run: python send_once.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            screenshot.png
            page.html
